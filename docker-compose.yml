services:
  db:
    image: postgres:16-alpine
    container_name: protocolo-bim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: protocolo_bim
    ports:
      - '5432:5432'
    volumes:
      - protocolo-bim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  protocolo-bim-pgdata:
